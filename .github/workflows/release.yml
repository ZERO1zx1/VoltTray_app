name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
          - platform: windows-latest
            args: "--bundles nsis,msi"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release tag matches the app version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${app.version}` || pkg.version !== app.version) {
            throw new Error('Release tag, package.json, and tauri.conf.json versions must match');
          }
          NODE

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "VoltTray v__VERSION__"
          releaseBody: "Local-first, read-only system tray battery monitor for Windows and Linux."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Smoke-test Linux release CLI without a display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unset DISPLAY WAYLAND_DISPLAY
          binary=src-tauri/target/release/volttray
          "$binary" --help
          "$binary" --version
          "$binary" status --json > snapshot.json
          node --input-type=module -e "import fs from 'node:fs'; const s = JSON.parse(fs.readFileSync('snapshot.json', 'utf8')); if (!Array.isArray(s.devices)) throw new Error('Invalid hardware snapshot');"
          if "$binary" --invalid-option; then
            echo "Invalid CLI argument unexpectedly succeeded" >&2
            exit 1
          else
            test "$?" -eq 2
          fi

      - name: Smoke-test Windows release CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Binary = Join-Path $PWD 'src-tauri/target/release/volttray.exe'
          function Invoke-VoltTray([string[]]$CliArgs, [int]$ExpectedCode) {
            $Stdout = Join-Path $env:RUNNER_TEMP 'volttray-stdout.txt'
            $Stderr = Join-Path $env:RUNNER_TEMP 'volttray-stderr.txt'
            $Process = Start-Process -FilePath $Binary -ArgumentList $CliArgs -Wait -PassThru -NoNewWindow -RedirectStandardOutput $Stdout -RedirectStandardError $Stderr
            $Output = Get-Content $Stdout -Raw
            if ($Process.ExitCode -ne $ExpectedCode) {
              Get-Content $Stderr | Write-Host
              throw "CLI exit code $($Process.ExitCode), expected $ExpectedCode"
            }
            return $Output
          }
          $Help = Invoke-VoltTray -CliArgs @('--help') -ExpectedCode 0
          if ($Help -notmatch 'VoltTray') { throw 'Missing CLI help output' }
          $Version = Invoke-VoltTray -CliArgs @('--version') -ExpectedCode 0
          if ($Version.Trim() -ne "VoltTray $($env:GITHUB_REF_NAME.Substring(1))") { throw 'Unexpected CLI version' }
          $Snapshot = Invoke-VoltTray -CliArgs @('status', '--json') -ExpectedCode 0 | ConvertFrom-Json
          if ($null -eq $Snapshot -or $null -eq $Snapshot.devices) { throw 'Invalid hardware snapshot' }
          Invoke-VoltTray -CliArgs @('--invalid-option') -ExpectedCode 2 | Out-Null

  release-checksums:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all draft release assets and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets
          cd release-assets
          # Refuse an incomplete release, even if the upload step returned success.
          for pattern in '*.AppImage' '*.deb' '*-setup.exe' '*.msi'; do
            compgen -G "$pattern" > /dev/null || { echo "Missing release asset: $pattern" >&2; exit 1; }
          done
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
            | LC_ALL=C sort -z \
            | xargs -0 -r sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
