[package]
name = "volttray"
version = "1.0.0"
description = "Lightweight local peripheral battery monitor for Windows and Linux"
authors = ["VoltTray"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
